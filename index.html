<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Epistellaire - Galerie immersive</title>
  <meta name="description" content="Epistellaire est une galerie immersive ou chaque page devient une constellation a feuilleter." />
  <meta name="theme-color" content="#0a0a09" />
  <meta property="og:title" content="Epistellaire - Galerie immersive" />
  <meta property="og:description" content="Une experience de lecture artistique et immersive pour explorer les planches d'Epistellaire." />
  <meta property="og:image" content="assets/pages/001.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a09;
      --ink: #fbf6ed;
      --muted: rgba(251, 246, 237, 0.68);
      --quiet: rgba(251, 246, 237, 0.46);
      --line: rgba(251, 246, 237, 0.16);
      --line-strong: rgba(251, 246, 237, 0.28);
      --panel: rgba(14, 14, 13, 0.72);
      --panel-strong: rgba(14, 14, 13, 0.9);
      --paper: #f6ead9;
      --ember: #d99a54;
      --mineral: #6eb8a2;
      --oxide: #a75f47;
      --shadow: 0 24px 90px rgba(0, 0, 0, 0.62);
      --radius: 8px;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(rgba(255, 255, 255, 0.026) 1px, transparent 1px),
        radial-gradient(circle at 50% 18%, rgba(251, 246, 237, 0.08), transparent 34%),
        linear-gradient(180deg, #11110f, var(--bg) 44%, #070706);
      background-size: 48px 48px, 48px 48px, auto, auto;
      background-attachment: fixed;
      letter-spacing: 0;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
      letter-spacing: 0;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 18px;
      padding: 16px 22px 0;
      width: min(1560px, 100%);
      margin: 0 auto;
    }

    .brand {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .brand-kicker {
      color: var(--quiet);
      font-size: 0.78rem;
    }

    .brand-name {
      margin: 0;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 2.2rem;
      line-height: 1;
      font-weight: 700;
    }

    .top-note {
      justify-self: center;
      max-width: 52ch;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
      text-align: center;
    }

    .status-strip {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(8, 9, 8, 0.5);
      backdrop-filter: blur(18px);
      color: var(--muted);
      white-space: nowrap;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.24);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--mineral);
      border-radius: 999px;
      box-shadow: 0 0 18px rgba(110, 184, 162, 0.86);
    }

    .reader {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 18px 22px 24px;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 18px;
      align-items: stretch;
    }

    .intro {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: end;
      gap: 16px;
      padding: 0 2px;
    }

    .folio-title {
      margin: 0;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.6rem;
      line-height: 1;
      font-weight: 600;
    }

    .folio-subtitle {
      color: var(--quiet);
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .folio-rule {
      height: 1px;
      background: linear-gradient(90deg, var(--line-strong), transparent);
      align-self: center;
    }

    .reader-panel {
      position: relative;
      min-height: calc(100vh - 156px);
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .reader-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      box-shadow: inset 0 1px 0 rgba(255, 247, 235, 0.18);
    }

    .viewport {
      position: relative;
      min-height: 0;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 247, 235, 0.14);
      border-radius: var(--radius);
      background:
        linear-gradient(90deg, rgba(167, 95, 71, 0.16), transparent 18%, transparent 82%, rgba(110, 184, 162, 0.14)),
        linear-gradient(135deg, rgba(31, 47, 41, 0.32), rgba(13, 12, 12, 0.9)),
        rgba(8, 9, 8, 0.66);
      overflow: hidden;
    }

    .viewport::before,
    .viewport::after {
      content: "";
      position: absolute;
      pointer-events: none;
      z-index: 1;
    }

    .viewport::before {
      inset: 14px;
      border: 1px solid rgba(251, 246, 237, 0.11);
      border-radius: 6px;
    }

    .viewport::after {
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1px;
      background: linear-gradient(transparent, rgba(251, 246, 237, 0.18), transparent);
      opacity: 0.42;
    }

    #flipbook {
      width: 100%;
      height: 100%;
      min-height: 560px;
      position: relative;
      z-index: 2;
    }

    .page-item {
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.12), transparent 12%, transparent 88%, rgba(0, 0, 0, 0.12)),
        var(--paper);
    }

    .page-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .fallback-gallery {
      display: none;
      width: 100%;
      height: 100%;
      overflow: auto;
      scroll-snap-type: x mandatory;
      grid-auto-flow: column;
      grid-auto-columns: minmax(260px, 82%);
      gap: 14px;
      padding: 14px;
    }

    .fallback-gallery.is-visible { display: grid; }

    .fallback-gallery img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      scroll-snap-align: center;
      background: var(--paper);
      border-radius: var(--radius);
    }

    .toolbar {
      position: relative;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      min-height: 74px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(251, 246, 237, 0.055), transparent), var(--panel-strong);
    }

    .nav-group,
    .action-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-button {
      display: inline-grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border: 1px solid rgba(255, 247, 235, 0.2);
      border-radius: var(--radius);
      color: var(--ink);
      background: rgba(251, 246, 237, 0.07);
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .icon-button:hover:not(:disabled),
    .icon-button:focus-visible {
      transform: translateY(-1px);
      border-color: rgba(217, 154, 84, 0.72);
      background: rgba(217, 154, 84, 0.18);
      outline: none;
    }

    .icon-button:disabled {
      opacity: 0.34;
      cursor: not-allowed;
      transform: none;
    }

    .page-state {
      min-width: 0;
      display: grid;
      gap: 7px;
      align-items: center;
    }

    .page-line {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
    }

    .page-indicator {
      color: var(--quiet);
      font-size: 0.88rem;
      white-space: nowrap;
    }

    .page-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.45rem;
      font-weight: 600;
    }

    .scrubber-row { display: grid; }

    input[type="range"] {
      width: 100%;
      height: 28px;
      margin: 0;
      accent-color: var(--ember);
      cursor: pointer;
    }

    .progress-track {
      height: 3px;
      background: rgba(255, 247, 235, 0.14);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--mineral), var(--ember), var(--oxide));
      transition: width 220ms ease;
    }

    .loading-note {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      padding: 24px;
      background: rgba(8, 9, 8, 0.34);
    }

    .loading-note.is-hidden { display: none; }

    @media (max-width: 1020px) {
      .topbar {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .top-note {
        justify-self: start;
        text-align: left;
      }

      .status-strip {
        width: max-content;
        max-width: 100%;
      }

      .reader-panel { min-height: 72vh; }
    }

    @media (max-width: 680px) {
      .topbar,
      .reader {
        padding-left: 12px;
        padding-right: 12px;
      }

      .brand-name { font-size: 2.2rem; }

      .intro {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .folio-rule { display: none; }

      .reader-panel {
        min-height: 66vh;
        padding: 8px;
      }

      #flipbook { min-height: 390px; }

      .toolbar { grid-template-columns: 1fr; }

      .nav-group,
      .action-group { justify-content: center; }

      .page-line {
        display: grid;
        gap: 2px;
        justify-items: center;
        text-align: center;
      }

      .page-title { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand" aria-label="Epistellaire">
        <span class="brand-kicker">Edition immersive - V1 livrable</span>
        <h1 class="brand-name">Epistellaire</h1>
      </div>
      <p class="top-note">
        Galerie numerique pour laisser les planches occuper la scene, avec une navigation precise et un cadre volontairement silencieux.
      </p>
      <div class="status-strip" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="statusText">Chargement de l'atlas...</span>
      </div>
    </header>

    <section class="reader" aria-label="Livre numerique Epistellaire">
      <aside class="intro">
        <h2 class="folio-title" id="folioTitle">Couverture</h2>
        <div class="folio-rule" aria-hidden="true"></div>
        <div class="folio-subtitle" id="folioSubtitle">Page 1 sur 9</div>
      </aside>

      <section class="reader-panel" id="readerPanel">
        <div class="viewport">
          <div id="flipbook"></div>
          <div class="fallback-gallery" id="fallbackGallery" aria-label="Galerie de secours"></div>
          <div class="loading-note" id="loadingNote">Preparation des pages...</div>
        </div>

        <div class="toolbar" role="toolbar" aria-label="Controles du livre">
          <div class="nav-group">
            <button class="icon-button" type="button" data-action="first" title="Premiere page" aria-label="Premiere page">
              <i data-lucide="skip-back"></i>
            </button>
            <button class="icon-button" type="button" data-action="prev" title="Page precedente" aria-label="Page precedente">
              <i data-lucide="chevron-left"></i>
            </button>
          </div>

          <div class="page-state">
            <div class="page-line">
              <span class="page-title" id="pageTitle">&nbsp;</span>
              <span class="page-indicator" id="pageIndicator">Page 1 / 1</span>
            </div>
            <div class="scrubber-row">
              <input type="range" min="1" max="1" value="1" step="1" id="pageScrubber" aria-label="Aller a la page" />
              <div class="progress-track" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
            </div>
          </div>

          <div class="action-group">
            <button class="icon-button" type="button" data-action="next" title="Page suivante" aria-label="Page suivante">
              <i data-lucide="chevron-right"></i>
            </button>
            <button class="icon-button" type="button" data-action="last" title="Derniere page" aria-label="Derniere page">
              <i data-lucide="skip-forward"></i>
            </button>
            <button class="icon-button" type="button" data-action="fullscreen" title="Plein ecran" aria-label="Plein ecran">
              <i data-lucide="maximize-2"></i>
            </button>
            <a class="icon-button" id="downloadLink" href="#" download title="Telecharger la page" aria-label="Telecharger la page">
              <i data-lucide="download"></i>
            </a>
          </div>
        </div>
      </section>
    </section>
  </main>

</body>
