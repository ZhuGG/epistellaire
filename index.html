<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Epistellaire - Galerie immersive</title>
  <meta name="description" content="Epistellaire est une galerie immersive ou chaque page devient une constellation a feuilleter." />
  <meta name="theme-color" content="#0b0b0a" />
  <meta property="og:title" content="Epistellaire - Galerie immersive" />
  <meta property="og:description" content="Une experience de lecture artistique pour explorer les planches d'Epistellaire." />
  <meta property="og:image" content="assets/pages/001.jpg" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230b0b0a'/%3E%3Cpath d='M14 45c12-8 24-8 36 0V18c-12-6-24-6-36 0v27Z' fill='none' stroke='%23d7aa61' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M32 17v27' stroke='%2386b9a4' stroke-width='3'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0b0b0a;
      --bg-lift: #12120f;
      --ink: #fbf5ea;
      --muted: rgba(251, 245, 234, 0.68);
      --quiet: rgba(251, 245, 234, 0.44);
      --line: rgba(251, 245, 234, 0.16);
      --line-strong: rgba(251, 245, 234, 0.3);
      --panel: rgba(18, 18, 15, 0.82);
      --panel-soft: rgba(251, 245, 234, 0.055);
      --paper: #f7eddf;
      --gold: #d7aa61;
      --sage: #86b9a4;
      --rust: #a85f45;
      --shadow: 0 28px 90px rgba(0, 0, 0, 0.58);
      --radius: 8px;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
        radial-gradient(circle at 50% -12%, rgba(215, 170, 97, 0.15), transparent 32rem),
        linear-gradient(180deg, #171611, var(--bg) 38%, #070706);
      background-size: 64px 64px, 64px 64px, auto, auto;
      background-attachment: fixed;
      letter-spacing: 0;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
      letter-spacing: 0;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 14px;
      padding: 18px;
    }

    .topbar {
      width: min(1600px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(160px, auto) minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
    }

    .brand {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .brand-kicker,
    .folio-subtitle,
    .page-indicator,
    .status-strip {
      color: var(--quiet);
      font-size: 0.78rem;
    }

    .brand-name,
    .folio-title,
    .page-title {
      margin: 0;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 600;
    }

    .brand-name {
      font-size: 2.2rem;
      line-height: 1;
      font-weight: 700;
    }

    .folio-meta {
      justify-self: center;
      display: grid;
      gap: 2px;
      text-align: center;
      min-width: 0;
    }

    .folio-title {
      font-size: 1.35rem;
      line-height: 1.05;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: min(46vw, 46rem);
    }

    .status-strip {
      min-height: 40px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(11, 11, 10, 0.52);
      backdrop-filter: blur(16px);
      white-space: nowrap;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--sage);
      box-shadow: 0 0 20px rgba(134, 185, 164, 0.76);
    }

    .reader {
      width: min(1600px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 12px;
      min-height: calc(100vh - 92px);
    }

    .reader-panel {
      position: relative;
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(251, 245, 234, 0.08), rgba(251, 245, 234, 0.025)),
        var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .reader-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      box-shadow:
        inset 0 1px 0 rgba(251, 245, 234, 0.18),
        inset 0 -1px 0 rgba(0, 0, 0, 0.5);
    }

    .viewport {
      position: relative;
      min-height: 0;
      display: grid;
      place-items: center;
      border: 1px solid rgba(251, 245, 234, 0.14);
      border-radius: var(--radius);
      background:
        linear-gradient(90deg, rgba(168, 95, 69, 0.14), transparent 17%, transparent 83%, rgba(134, 185, 164, 0.12)),
        linear-gradient(135deg, rgba(27, 33, 26, 0.72), rgba(9, 9, 8, 0.94));
      overflow: hidden;
    }

    .viewport::before {
      content: "";
      position: absolute;
      inset: 18px;
      pointer-events: none;
      border: 1px solid rgba(251, 245, 234, 0.12);
      border-radius: 6px;
      z-index: 1;
    }

    #flipbook {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      min-height: 590px;
    }

    .page-item {
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.12), transparent 13%, transparent 87%, rgba(0, 0, 0, 0.12)),
        var(--paper);
    }

    .page-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .fallback-gallery {
      display: none;
      width: 100%;
      height: 100%;
      overflow: auto;
      scroll-snap-type: x mandatory;
      grid-auto-flow: column;
      grid-auto-columns: minmax(280px, 82%);
      gap: 14px;
      padding: 14px;
      z-index: 2;
    }

    .fallback-gallery.is-visible { display: grid; }

    .fallback-gallery img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      scroll-snap-align: center;
      background: var(--paper);
      border-radius: var(--radius);
    }

    .loading-note {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      padding: 24px;
      background: rgba(9, 9, 8, 0.42);
    }

    .loading-note.is-hidden { display: none; }

    .control-deck {
      position: relative;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      min-height: 76px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(180deg, var(--panel-soft), transparent), rgba(10, 10, 9, 0.92);
    }

    .nav-group,
    .action-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-button {
      display: inline-grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border: 1px solid rgba(251, 245, 234, 0.22);
      border-radius: var(--radius);
      color: var(--ink);
      background: rgba(251, 245, 234, 0.07);
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .icon-button:hover:not(:disabled),
    .icon-button:focus-visible {
      transform: translateY(-1px);
      border-color: rgba(215, 170, 97, 0.78);
      background: rgba(215, 170, 97, 0.16);
      outline: none;
    }

    .icon-button:disabled {
      opacity: 0.34;
      cursor: not-allowed;
      transform: none;
    }

    .page-state {
      min-width: 0;
      display: grid;
      gap: 8px;
      align-items: center;
    }

    .page-line {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
    }

    .page-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 1.45rem;
    }

    .page-indicator { white-space: nowrap; }

    input[type="range"] {
      width: 100%;
      height: 26px;
      margin: 0;
      accent-color: var(--gold);
      cursor: pointer;
    }

    .progress-track {
      height: 3px;
      background: rgba(251, 245, 234, 0.14);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--sage), var(--gold), var(--rust));
      transition: width 220ms ease;
    }

    .thumbnail-rail {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 72px;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 1px 8px;
      scrollbar-width: thin;
    }

    .thumb-button {
      position: relative;
      width: 72px;
      aspect-ratio: 3 / 4;
      padding: 0;
      border: 1px solid rgba(251, 245, 234, 0.18);
      border-radius: var(--radius);
      background: #15130f;
      overflow: hidden;
      cursor: pointer;
      opacity: 0.58;
      transition: opacity 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .thumb-button:hover,
    .thumb-button.is-active {
      opacity: 1;
      border-color: rgba(215, 170, 97, 0.78);
      transform: translateY(-1px);
    }

    .thumb-button img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @media (max-width: 980px) {
      .app { padding: 14px; }

      .topbar {
        grid-template-columns: 1fr auto;
      }

      .folio-meta {
        grid-column: 1 / -1;
        grid-row: 2;
        justify-self: start;
        text-align: left;
      }

      .reader {
        min-height: calc(100vh - 136px);
      }
    }

    @media (max-width: 680px) {
      .app {
        padding: 10px;
        gap: 10px;
      }

      .topbar {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .brand-name { font-size: 2rem; }

      .status-strip { width: max-content; }

      #flipbook { min-height: 410px; }

      .control-deck {
        grid-template-columns: 1fr;
      }

      .nav-group,
      .action-group {
        justify-content: center;
      }

      .page-line {
        display: grid;
        gap: 3px;
        justify-items: center;
        text-align: center;
      }

      .thumbnail-rail {
        grid-auto-columns: 58px;
      }

      .thumb-button { width: 58px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand" aria-label="Epistellaire">
        <span class="brand-kicker">Edition immersive</span>
        <h1 class="brand-name">Epistellaire</h1>
      </div>
      <div class="folio-meta">
        <h2 class="folio-title" id="folioTitle">Couverture</h2>
        <div class="folio-subtitle" id="folioSubtitle">Page 1 sur 9</div>
      </div>
      <div class="status-strip" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="statusText">Chargement de l'atlas...</span>
      </div>
    </header>

    <section class="reader" aria-label="Livre numerique Epistellaire">
      <section class="reader-panel" id="readerPanel">
        <div class="viewport">
          <div id="flipbook"></div>
          <div class="fallback-gallery" id="fallbackGallery" aria-label="Galerie de secours"></div>
          <div class="loading-note" id="loadingNote">Preparation des pages...</div>
        </div>

        <div class="control-deck" role="toolbar" aria-label="Controles du livre">
          <div class="nav-group">
            <button class="icon-button" type="button" data-action="first" title="Premiere page" aria-label="Premiere page">
              <i data-lucide="skip-back"></i>
            </button>
            <button class="icon-button" type="button" data-action="prev" title="Page precedente" aria-label="Page precedente">
              <i data-lucide="chevron-left"></i>
            </button>
          </div>

          <div class="page-state">
            <div class="page-line">
              <span class="page-title" id="pageTitle">&nbsp;</span>
              <span class="page-indicator" id="pageIndicator">Page 1 / 1</span>
            </div>
            <div>
              <input type="range" min="1" max="1" value="1" step="1" id="pageScrubber" aria-label="Aller a la page" />
              <div class="progress-track" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
            </div>
          </div>

          <div class="action-group">
            <button class="icon-button" type="button" data-action="next" title="Page suivante" aria-label="Page suivante">
              <i data-lucide="chevron-right"></i>
            </button>
            <button class="icon-button" type="button" data-action="last" title="Derniere page" aria-label="Derniere page">
              <i data-lucide="skip-forward"></i>
            </button>
            <button class="icon-button" type="button" data-action="fullscreen" title="Plein ecran" aria-label="Plein ecran">
              <i data-lucide="maximize-2"></i>
            </button>
            <a class="icon-button" id="downloadLink" href="#" download title="Telecharger la page" aria-label="Telecharger la page">
              <i data-lucide="download"></i>
            </a>
          </div>
        </div>
      </section>

      <nav class="thumbnail-rail" id="thumbnailRail" aria-label="Miniatures des pages"></nav>
    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
